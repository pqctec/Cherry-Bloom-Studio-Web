name: Revisión de seguridad

# Corre en cada push y en cada Pull Request hacia main. El resultado (verde
# o rojo) es lo que una regla de protección de rama en GitHub puede exigir
# antes de dejar fusionar un PR — así un cambio que agregue una dependencia
# insegura, o que ni siquiera compile, no puede colarse sin que alguien lo
# vea primero.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  audit:
    name: Dependencias y build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      # --audit-level=high: falla el check si alguna dependencia tiene una
      # vulnerabilidad conocida de severidad alta o crítica. Vulnerabilidades
      # menores (low/moderate) no bloquean, para no frenar cada PR por cosas
      # de bajo riesgo — Dependabot (ver dependabot.yml) las va a ir
      # actualizando solas de todas formas.
      - name: Revisar vulnerabilidades conocidas (npm audit)
        run: npm audit --audit-level=high

      # "npm run lint" no se usa acá a propósito: este proyecto corre
      # Next.js 16, que ya no trae el comando "next lint" integrado (fue
      # quitado) y el proyecto todavía no tiene ESLint configurado aparte —
      # agregarlo aquí solo haría que el check fallara siempre sin
      # decir nada real sobre el código. En su lugar, un build real de
      # producción sí detecta errores de verdad (código roto, imports que no
      # existen, etc.) sin depender de ninguna variable de entorno/secreto.
      - name: Verificar que el proyecto compile (build de producción)
        run: npx next build
